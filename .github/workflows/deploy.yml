name: Deploy Node App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/carrier-backend

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # npm ci installs exactly what package-lock.json pins, so the server runs
            # the tree that was tested. `npm install` can resolve different versions on
            # the box than on a developer's machine, and `--force` disables the checks
            # that would have told us.
            npm ci --omit=dev

            # Restart ONLY this repo's app, by name. pm2 on this box also runs an
            # unrelated email/chat sync app called `index` (port 5001) — `pm2 restart
            # all` was bouncing that too, and failing this whole deploy whenever one of
            # its entries was missing.
            APP=carrier
            pm2 restart "$APP" --update-env
            pm2 save

            # The port the app actually binds: .env wins, else index.js's default.
            # Hardcoding it here is how a health check passes against the wrong process.
            PORT=$(grep -E '^PORT=' .env 2>/dev/null | tail -1 | sed -E 's/^PORT=//; s/[^0-9]//g')
            PORT=${PORT:-8080}
            echo "health check will probe 127.0.0.1:$PORT"

            # A deploy that leaves the app crash-looping must FAIL. Without this, pm2
            # reports the restart as fine, the workflow goes green, and the first person
            # to notice is a customer getting a 502.
            for i in $(seq 1 15); do
              sleep 2
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$PORT/" || true)
              if [ "$code" = "200" ]; then
                echo "health check: origin answered 200 on :$PORT after $((i * 2))s"
                exit 0
              fi
            done
            echo "health check FAILED — $APP is not answering on :$PORT."
            pm2 describe "$APP" || true
            pm2 logs "$APP" --lines 60 --nostream || true
            exit 1
